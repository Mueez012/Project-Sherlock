[project]
name = "threatmamba"
dynamic = ["version"]
description = "ThreatMAMBA reproduction: CTI text -> TTPs + IOCs -> CSKG -> threat actor attribution"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/threatmamba"]

# When the TTP Extractor needs torch, add "torch" to dependencies and uncomment this so CI and the
# image download the small CPU-only wheel instead of multi-GB CUDA wheels.
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true
# [tool.uv.sources]
# torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["datasets", "services", "frontend"]

[tool.ruff.lint]
# S = flake8-bandit security rules: the "SAST in every commit" checkmark, no account needed
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                       # assert is how pytest works
"src/threatmamba/data/**" = ["S324", "E701", "E702", "E741", "E501", "E731", "SIM108", "SIM115", "N806", "B905", "B007", "UP031"]  # sha1 is an ID, not security; compact research code

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long tests (run on QA and main only)",
    "system: needs the running container (TM_BASE_URL)",
]
addopts = "--strict-markers -m 'not system'"

[tool.coverage.run]
source = ["src/threatmamba"]
omit = [
    # executable script, exercised end-to-end by the datasets CI job instead of unit tests
    "src/threatmamba/data/verify_datasets.py",
]
