# Local:    docker compose up -d --build     -> website http://localhost:3000, hub http://localhost:8000
#           Runs on any machine with Docker: TTP runs on CPU. With an NVIDIA GPU (and the NVIDIA Container Toolkit):
#           docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Release:  TM_IMAGE=ghcr.io/<owner>/threatmamba:latest docker compose up -d app
# Ports:    TM_PORT and WEB_PORT change the host ports (e.g. TM_PORT=8080 where Splunk already uses 8000).
# Modes:    the defaults below are stub (CI starts only `app`); .env switches a module to real (see .env.example).
#           The hub does not wait for the services: it reports them as down until they are healthy.
# Models:   the one-shot `models` service downloads the model bundle (models/manifest.json, SHA-256 checked) into the
#           ttp-models volume on the first start (about 1.4 GB); later starts reuse it. `ttp` starts once it is done.
services:
  app:            # the hub
    image: ${TM_IMAGE:-threatmamba:local}
    build: .
    ports:
      - "${TM_PORT:-8000}:8000"
    environment:
      TM_MODEL_MODE: ${TM_MODEL_MODE:-stub}
      TM_TTP_MODE: ${TM_TTP_MODE:-}
      TM_IOC_MODE: ${TM_IOC_MODE:-}
      TM_TTP_URL: http://ttp:8001
      TM_IOC_URL: http://ioc:8002
      TM_IOC_EXTENDED_TYPES: ${TM_IOC_EXTENDED_TYPES:-false}
    restart: unless-stopped

  models:         # one-shot: downloads and checks the model bundle into the ttp-models volume, then exits
    image: python:3.12-slim
    command: ["python", "/fetch/fetch_models.py", "--models", "/models", "--manifest", "/fetch/manifest.json"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts/fetch_models.py:/fetch/fetch_models.py:ro
      - ./models/manifest.json:/fetch/manifest.json:ro
      - ttp-models:/models
    restart: "no"

  ttp:            # the trained TTP model (CPU here; docker-compose.gpu.yml switches it to an NVIDIA GPU)
    image: ${TTP_IMAGE:-threatmamba-ttp:local}
    build:
      context: ./services/ttp
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu   # the CPU-only torch build: small, runs anywhere
    environment:
      TTP_API_BUNDLE_DIR: /models/ttp-v3
      TTP_API_DEVICE: cpu
    volumes:
      - ttp-models:/models:ro
    depends_on:
      models:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  ioc:            # IOC Hunter; reachable by the hub on the compose network
    image: ${IOC_IMAGE:-threatmamba-ioc:local}
    build: ./services/ioc
    environment:
      IOC_HUNTER_STORE: /data
      OTX_API_KEY: ${OTX_API_KEY:-}
      VT_API_KEY: ${VT_API_KEY:-}
    volumes:
      - ioc-data:/data
    init: true
    shm_size: "1gb"
    restart: unless-stopped

  web:            # the website; talks only to the hub, over the compose network
    image: ${WEB_IMAGE:-threatmamba-web:local}
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://app:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ioc-data:
  ttp-models:
