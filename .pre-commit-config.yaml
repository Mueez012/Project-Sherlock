# Install once per clone:  uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# datasets/ must stay byte-exact; services/ and frontend/ are checked by their own tooling
exclude: ^(datasets|services|frontend)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, ci, chore, refactor, perf, build, data]
  - repo: local
    hooks:
      - id: unit-tests-fast
        name: unit tests (fast)
        entry: uv run pytest -m "not slow and not system" -x -q
        language: system
        pass_filenames: false
        stages: [pre-push]
