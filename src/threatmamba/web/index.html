<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreatMAMBA</title>
<style>
  :root {
    --paper: #eef2f1; --sheet: #ffffff; --ink: #17212b; --muted: #5b6875;
    --rule: #c9d1d6; --mark: #ffe27a; --ttp: #2f5d8a; --warn: #8a4b12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           padding: 18px 28px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
  header h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.01em; }
  #status { color: var(--muted); font-size: 0.875rem; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px;
         max-width: 1200px; margin: 24px auto; padding: 0 28px; }
  section { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  textarea { width: 100%; min-height: 260px; resize: vertical; padding: 12px; border: 1px solid var(--rule);
             border-radius: 4px; font: 15px/1.55 "Iowan Old Style", Charter, Georgia, serif; color: var(--ink); }
  .actions { display: flex; gap: 12px; margin-top: 12px; }
  button { font: inherit; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--ink); cursor: pointer;
           background: var(--ink); color: #fff; }
  button.secondary { background: transparent; color: var(--ink); }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--ttp); outline-offset: 2px; }
  .note { color: var(--warn); font-size: 0.875rem; margin: 0 0 16px; }
  .empty { color: var(--muted); }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
  li { padding: 4px 0; border-bottom: 1px solid var(--paper); font-variant-numeric: tabular-nums; }
  .tid { color: var(--ttp); font-weight: 600; margin-right: 8px; }
  .kind { color: var(--muted); margin-right: 8px; }
  #report { grid-column: 1 / -1; }
  #annotated p { margin: 0; padding: 6px 0 6px 96px; position: relative;
                 font: 17px/1.65 "Iowan Old Style", Charter, Georgia, serif; max-width: 80ch; }
  #annotated p.hit { border-left: 3px solid var(--ttp); }
  #annotated .tags { position: absolute; left: 12px; top: 8px; width: 76px;
                     font: 600 12px/1.3 system-ui, sans-serif; color: var(--ttp); }
  mark { background: var(--mark); padding: 0 2px; border-radius: 2px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } #annotated p { padding-left: 12px; }
    #annotated .tags { position: static; display: block; width: auto; } }
</style>
</head>
<body>
<header>
  <h1>ThreatMAMBA</h1>
  <span id="status">Checking service…</span>
</header>
<main>
  <section>
    <h2>Threat report</h2>
    <label for="text" class="empty">Paste the text of a CTI report.</label>
    <textarea id="text"></textarea>
    <div class="actions">
      <button id="analyze">Analyze report</button>
      <button id="sample" class="secondary">Load sample report</button>
    </div>
  </section>
  <section aria-live="polite">
    <h2>Findings</h2>
    <div id="findings"><p class="empty">Results appear here after you analyze a report.</p></div>
  </section>
  <section id="report">
    <h2>Evidence in the report</h2>
    <div id="annotated"><p class="empty">Each sentence that contains a technique is marked in the margin; indicators are highlighted.</p></div>
  </section>
</main>
<script>
const SAMPLE = `The intrusion began with a spear-phishing email carrying a malicious attachment.
When the victim enabled macros, a PowerShell command downloaded a payload from hxxp://update-check[.]info/a.ps1.
The implant contacted its command-and-control server at 185.12.45[.]201 over HTTPS traffic.
Persistence was set through a Run key, and Mimikatz was used to dump credentials from LSASS.
The dropper had SHA256 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08.
Finally the operators began to exfiltrate archives to the same server.`;

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

fetch("/health").then((r) => r.json()).then((h) => {
  $("status").textContent = `Version ${h.version}, ${h.mode === "stub" ? "baseline extractors" : "trained models"}`;
}).catch(() => { $("status").textContent = "Service unavailable"; });

$("sample").onclick = () => { $("text").value = SAMPLE; $("text").focus(); };

$("analyze").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) { $("findings").innerHTML = '<p class="note">Paste a report first, or load the sample.</p>'; return; }
  $("analyze").disabled = true;
  $("analyze").textContent = "Analyzing…";
  try {
    const r = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error(`The service returned ${r.status}.`);
    render(await r.json());
  } catch (e) {
    $("findings").innerHTML = `<p class="note">Analysis failed: ${esc(e.message)} Check that the service is running.</p>`;
  } finally {
    $("analyze").disabled = false;
    $("analyze").textContent = "Analyze report";
  }
};

function render(res) {
  const techniques = [...new Set(res.ttps.map((t) => t.technique_id))];
  const attribution = res.attribution
    ? `<ul>${res.attribution.ranked.map((a) => `<li>${esc(a.actor)} ${(a.score * 100).toFixed(1)}%</li>`).join("")}</ul>`
    : '<p class="note">Attribution needs the trained classifier, which is not available yet.</p>';
  $("findings").innerHTML = `
    <h2>Likely threat actor</h2>${attribution}
    <h2>Techniques (${techniques.length})</h2>
    ${techniques.length ? `<ul>${techniques.map((t) => `<li><span class="tid">${t}</span>${
        res.ttps.filter((x) => x.technique_id === t).length} sentence(s)</li>`).join("")}</ul>` : '<p class="empty">None found.</p>'}
    <h2>Indicators (${res.iocs.length})</h2>
    ${res.iocs.length ? `<ul>${res.iocs.map((i) => `<li><span class="kind">${i.type}</span>${esc(i.value)}</li>`).join("")}</ul>`
                      : '<p class="empty">None found.</p>'}`;

  $("annotated").innerHTML = res.sentences.map((s, idx) => {
    const tids = [...new Set(res.ttps.filter((t) => t.sentence_index === idx).map((t) => t.technique_id))];
    let html = esc(s);
    for (const ioc of res.iocs.filter((i) => i.sentence_index === idx)) {
      const pattern = esc(ioc.value).replace(/[.*+?^${}()|[\]\\/]/g, "\\$&")
        .replace(/\\\./g, "(?:\\.|\\[\\.\\])").replace(/^http/, "h(?:tt|xx)p");
      const raw = esc(s).match(new RegExp(pattern, "i"));
      if (raw) html = html.replace(raw[0], `<mark>${raw[0]}</mark>`);
    }
    return `<p class="${tids.length ? "hit" : ""}"><span class="tags">${tids.join("<br>")}</span>${html}</p>`;
  }).join("");
}
</script>
</body>
</html>
